dataset_version: sdf_meridian_v0.1
raw_pdf_dir: data/raw/pdf
param_table_path: data/raw/param_table.csv
condition_specs_path: data/processed/condition_specs.jsonl
meridian_samples_dir: data/processed/meridian_samples
meridian_index_path: data/processed/meridian_index.csv
reports_dir: data/reports

defaults:
  disk_type: HPT
  material_id: Inco718
  speed_rpm: 11292.0
  temperature_c: 650.0
  density_kg_per_mm3: 0.00000819
  stress_limit_mpa: 1030.0
  r_bore_mm: 87.5
  r_outer_mm: 356.0
  z_bore_mm: 48.15
  z_rim_mm: 14.0

sdf:
  grid_shape: [256, 256]
  sdf_clip_mm: 12.0
  bbox_margin_mm: 8.0
  sign: inside_negative

quality:
  min_contour_points: 350
  radius_tolerance_mm: 2.5
  width_tolerance_mm: 2.5
  min_thickness_mm: 1.0
  max_zero_level_error_grid_cells: 2.0
  min_inside_pixels: 200

preview:
  dpi: 130
  random_review_count: 10
  random_seed: 20260525

condition:
  source: data/raw/param_table.csv
  columns:
    - hub_r_end_mm
    - rim_r_start_mm
    - angle_web_deg
    - r_trans_bore_web_mm
    - z_min
  notes: >
    Design-time CAD parameters from param_table.csv.
    Envelope scalars (r_bore_mm, r_outer_mm, z_width_mm, speed_rpm, temperature_c)
    are constant across sdf_meridian_v0.1 and excluded from conditioning.
